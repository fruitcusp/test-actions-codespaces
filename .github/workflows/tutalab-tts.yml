# TuTaLab — máy đọc VieNeu trên GitHub Actions (di trú 25/11/2026).
# Đặt tại .github/workflows/tutalab-tts.yml trong repo
# fruitcusp/test-actions-codespaces. Secrets cần có: CF_API_TOKEN (token
# Cloudflare tài khoản phu — quyền D1 + Workers KV), CF_ACCOUNT_ID,
# CF_KV_TOKENS (18 token quay vòng kho KV).
# Kích hoạt: workflow_dispatch từ functions (input job_id) + cron quét hàng
# đợi D1 mỗi 5 phút (job nộp khi dispatch lỗi vẫn được nhặt trong ≤5 phút).
# Luồng (25/11, pha song song): plan (nhẹ, chỉ D1/KV) quyết định theo
# SPLIT_MIN_CHARS trong worker.py — batch ngắn đi job "single" đúng đường
# cũ; batch dài (>=1.000 ký tự) chia nhóm unit cho ma trận "synth" chạy
# song song (trần 20 luồng), rồi "assemble" ghép + chốt kết quả. Hợp đồng
# với Pages (ghres/ghbin/D1) không đổi ở cả hai đường.
# IMAGE HOÁ (25/11): job single + synth chạy trong container
# ghcr.io/fruitcusp/tutalab-worker:latest (ffmpeg + VieNeu 3.8.5 + model
# nạp sẵn + Rust dist giải nén sẵn tại /tmp/rustdist) — không còn khâu
# apt/pip/cache lúc chạy. Dựng image bằng workflow build-worker-image
# (dispatch tay). Bản workflow trước image hoá lưu tại
# tutalab-worker/tutalab-tts.yml.pre-image (revert: chép lại file đó đè
# lên file này rồi push, <5 phút).
name: tutalab-tts

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Batch id (16 hex) — để trống = quét hàng đợi"
        required: false
        default: ""
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: tutalab-tts
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      batch: ${{ steps.plan.outputs.batch }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lên kế hoạch (đơn / song song)
        id: plan
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_TOKENS: ${{ secrets.CF_KV_TOKENS }}
          MODE: plan
          JOB_ID: ${{ inputs.job_id }}
        run: python tutalab-worker/worker.py

  single:
    needs: plan
    if: needs.plan.outputs.mode == 'single'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/fruitcusp/tutalab-worker:latest
      credentials:
        username: ${{ github.actor }}
        password: <redacted>
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra môi trường trong image
        run: |
          test -f /tmp/rustdist/vieneu-rs && echo "RUST_DIST_OK (image)"
          ffmpeg -version | head -1
          python -c "import vieneu; print('vieneu import OK')"
      - name: Chạy máy đọc (đường đơn)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_TOKENS: ${{ secrets.CF_KV_TOKENS }}
          ENGINE: rust
          RUST_DIST_URL: ${{ vars.RUST_DIST_URL }}
          RUST_THREADS: ${{ vars.RUST_THREADS }}
          MODE: single
          JOB_ID: ${{ needs.plan.outputs.batch }}
        run: python tutalab-worker/worker.py

  synth:
    needs: plan
    if: needs.plan.outputs.mode == 'parallel'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/fruitcusp/tutalab-worker:latest
      credentials:
        username: ${{ github.actor }}
        password: <redacted>
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra môi trường trong image
        run: |
          test -f /tmp/rustdist/vieneu-rs && echo "RUST_DIST_OK (image)"
          ffmpeg -version | head -1
          python -c "import vieneu; print('vieneu import OK')"
      - name: Đọc một nhóm đoạn (luồng song song)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_TOKENS: ${{ secrets.CF_KV_TOKENS }}
          ENGINE: rust
          RUST_DIST_URL: ${{ vars.RUST_DIST_URL }}
          RUST_THREADS: ${{ vars.RUST_THREADS }}
          MODE: synth
          GROUP_INDEX: ${{ matrix.group.g }}
          JOB_ID: ${{ needs.plan.outputs.batch }}
        run: python tutalab-worker/worker.py

  assemble:
    needs: [plan, synth]
    if: always() && needs.plan.outputs.mode == 'parallel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Ghép đoạn + chốt kết quả
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_TOKENS: ${{ secrets.CF_KV_TOKENS }}
          MODE: assemble
          JOB_ID: ${{ needs.plan.outputs.batch }}
        run: python tutalab-worker/worker.py
