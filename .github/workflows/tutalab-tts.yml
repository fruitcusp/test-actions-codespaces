# TuTaLab — máy đọc VieNeu trên GitHub Actions (di trú 25/11/2026).
# Đặt tại .github/workflows/tutalab-tts.yml trong repo
# fruitcusp/test-actions-codespaces. Secrets cần có: CF_API_TOKEN (token
# Cloudflare tài khoản phu — quyền D1 + Workers KV), CF_ACCOUNT_ID,
# CF_KV_TOKENS (18 token quay vòng kho KV).
# Kích hoạt: workflow_dispatch từ functions (input job_id) + cron quét hàng
# đợi D1 mỗi 5 phút (job nộp khi dispatch lỗi vẫn được nhặt trong ≤5 phút).
# Luồng (25/11, pha song song): plan (nhẹ, chỉ D1/KV) quyết định theo
# SPLIT_MIN_CHARS trong worker.py — batch ngắn đi job "single" đúng đường
# cũ; batch dài (>=1.000 ký tự) chia nhóm unit cho ma trận "synth" chạy
# song song (trần 12 luồng — đợt 1 quét GitHub 25/11, chia bể 20 khe toàn tài khoản), rồi "assemble" ghép + chốt kết quả. Hợp đồng
# với Pages (ghres/ghbin/D1) không đổi ở cả hai đường.
# IMAGE HOÁ (25/11): MỌI job chạy trong container
# ghcr.io/fruitcusp/tutalab-worker:latest (ffmpeg + VieNeu 3.8.5 + model
# nạp sẵn + Rust dist giải nén sẵn tại /tmp/rustdist) — không còn khâu
# apt/pip/cache lúc chạy. Dựng image bằng workflow build-worker-image
# (dispatch tay). Bản workflow trước image hoá lưu tại
# tutalab-worker/tutalab-tts.yml.pre-image (revert: chép lại file đó đè
# lên file này rồi push, <5 phút).
# GỘP PLAN (25/11): đường ngắn plan+single gộp thành 1 job "planrun"
# (MODE=planrun trong worker.py — plan xong, batch ngắn đọc luôn trong
# cùng job, chỉ mở máy 1 lần). Đường dài giữ planrun -> synth ->
# assemble. Mọi job container khai permissions packages:read tường
# minh. LƯU Ý: credentials GITHUB_TOKEN bị GHCR từ chối login ở mọi
# run container (45543942606, 45544237964 — kể cả khi đã khai
# packages:read) nên ĐÃ BỎ credentials: image đang public (không chứa
# secret nào; dist vốn đã public trong Release của chính repo này),
# runner pull ẩn danh. Khi nào có PAT packages thì gắn lại credentials
# + chuyển package sang private sau.
name: tutalab-tts

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Batch id (16 hex) — để trống = quét hàng đợi"
        required: false
        default: ""
  schedule:
    - cron: "*/5 * * * *"

# KHÔNG đặt concurrency group (đợt 2 sửa TuTaLab 25/11/2026): bản cũ
# group "tutalab-tts" + cancel-in-progress:false khiến GitHub chỉ giữ
# 1 run chạy + 1 run chờ cho TOÀN BỘ workflow — mỗi dispatch mới âm
# thầm HUỶ run đang chờ (đo đợt 1: bắn 20 job đồng thời -> 19/21 run
# cancelled, 0/20 batch được xử lý). Mỗi run chỉ claim đúng batch của
# nó qua input job_id + khóa claim nguyên tử trong D1 (UPDATE ... WHERE
# status='queued') nên chạy song song an toàn; trần song song thực tế
# do max-parallel 12 của ma trận synth + bể 20 khe toàn tài khoản giữ.

jobs:
  planrun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fruitcusp/tutalab-worker:latest
    outputs:
      mode: ${{ steps.planrun.outputs.mode }}
      batch: ${{ steps.planrun.outputs.batch }}
      groups: ${{ steps.planrun.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra môi trường trong image
        run: |
          test -f /tmp/rustdist/vieneu-rs && echo "RUST_DIST_OK (image)"
          ffmpeg -version | head -1
          python -c "import vieneu; print('vieneu import OK')"
      - name: Plan (+ đọc luôn nếu batch ngắn)
        id: planrun
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_TOKENS: ${{ secrets.CF_KV_TOKENS }}
          ENGINE: rust
          RUST_DIST_URL: ${{ vars.RUST_DIST_URL }}
          RUST_THREADS: ${{ vars.RUST_THREADS }}
          MODE: planrun
          JOB_ID: ${{ inputs.job_id }}
        run: python tutalab-worker/worker.py

  synth:
    needs: planrun
    if: needs.planrun.outputs.mode == 'parallel'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fruitcusp/tutalab-worker:latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        group: ${{ fromJSON(needs.planrun.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra môi trường trong image
        run: |
          test -f /tmp/rustdist/vieneu-rs && echo "RUST_DIST_OK (image)"
          ffmpeg -version | head -1
          python -c "import vieneu; print('vieneu import OK')"
      - name: Đọc một nhóm đoạn (luồng song song)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_TOKENS: ${{ secrets.CF_KV_TOKENS }}
          ENGINE: rust
          RUST_DIST_URL: ${{ vars.RUST_DIST_URL }}
          RUST_THREADS: ${{ vars.RUST_THREADS }}
          MODE: synth
          GROUP_INDEX: ${{ matrix.group.g }}
          JOB_ID: ${{ needs.planrun.outputs.batch }}
        run: python tutalab-worker/worker.py

  assemble:
    needs: [planrun, synth]
    if: always() && needs.planrun.outputs.mode == 'parallel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fruitcusp/tutalab-worker:latest
    steps:
      - uses: actions/checkout@v4
      - name: Ghép đoạn + chốt kết quả
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_TOKENS: ${{ secrets.CF_KV_TOKENS }}
          MODE: assemble
          JOB_ID: ${{ needs.planrun.outputs.batch }}
        run: python tutalab-worker/worker.py
