# vieneu-test — DO LUONG VieNeu Rust (bo Rust chung) tren Actions.
# 25/11/2026 (lenh Sep "chinh het sang ban rust"): ban goc do pip vieneu
# Python; nay chuyen han sang vieneu-rs trong image worker chung
# ghcr.io/fruitcusp/tutalab-worker:latest — workflow nay tu nay do
# RUST, khong con do duoc ban Python nua. Trigger + artifact giu nguyen:
# workflow_dispatch, artifact vieneu-test-output chua out.wav.
name: vieneu-test
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fruitcusp/tutalab-worker:latest
    steps:
      - uses: actions/checkout@v4
      - name: Machine specs
        run: |
          echo "=== MACHINE SPECS ==="
          uname -a
          echo "NPROC=$(nproc)"
          free -h
          df -h
          python3 --version
      - name: Kiem tra bo Rust chung trong image (khong cai dat gi)
        run: |
          set -eu
          test -f /tmp/rustdist/vieneu-rs && echo "RUST_DIST_OK (image)"
          ffmpeg -version | head -1
      - name: Benchmark VieNeu Rust (vieneu-rs, giong Ngoc Huyen)
        env:
          RUST_DIST: /tmp/rustdist
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, subprocess, time
          dist = os.environ.get("RUST_DIST") or "/tmp/rustdist"
          if not os.path.isfile(os.path.join(dist, "vieneu-rs")):
              for dp, _dn, fn in os.walk("/tmp/rustdist"):
                  if "vieneu-rs" in fn:
                      dist = dp
                      break
          text = "Xin chào, đây là bản thử giọng đọc truyện trên máy chủ GitHub Actions."
          print(f"TEXT={text}", flush=True)
          print("VOICE_SELECTED=Ngọc Huyền", flush=True)
          work = os.path.abspath("rs-bench")
          os.makedirs(work, exist_ok=True)
          units = os.path.join(work, "units.json")
          with open(units, "w", encoding="utf-8") as f:
              json.dump({"voice": "Ngọc Huyền",
                         "units": [{"id": "00", "text": text}]},
                        f, ensure_ascii=False)
          loader = os.path.join(dist, "syslibs", "ld-linux-x86-64.so.2")
          deadline = str(int(time.time()) + 1800)
          cmd = [loader, "--library-path", os.path.join(dist, "syslibs"),
                 os.path.join(dist, "vieneu-rs"),
                 "--model-dir", os.path.join(dist, "model", "int8"),
                 "--codec-dir", os.path.join(dist, "model", "codec"),
                 "--model-root", os.path.join(dist, "model"),
                 "--dict", os.path.join(dist, "assets", "sea_g2p.bin"),
                 "--voices-file", os.path.join(dist, "assets", "voices_v3_turbo.json"),
                 "worker", units, "", "", work, deadline, "0"]
          env = dict(os.environ, OMP_NUM_THREADS="2",
                     LC_ALL="C.UTF-8", LANG="C.UTF-8")
          t0 = time.time()
          r = subprocess.run(cmd, capture_output=True, text=True, cwd=dist, env=env)
          synth_s = time.time() - t0
          log = (r.stdout or "") + (r.stderr or "")
          seg = os.path.join(work, "seg_00.wav")
          if not os.path.isfile(seg):
              raise RuntimeError("rust produced no seg: " + log[-500:])
          subprocess.run(["cp", seg, "out.wav"], check=True)
          import re
          m = re.search(r"MODEL_LOADED\s+([0-9.]+)s", log)
          load_s = float(m.group(1)) if m else synth_s
          dur = subprocess.run(["ffprobe", "-v", "error", "-show_entries",
                                "format=duration", "-of", "csv=p=0", "out.wav"],
                               capture_output=True, text=True).stdout.strip()
          audio_s = float(dur) if dur else 0.0
          print(f"ENGINE=rust")
          print(f"MODEL_LOAD_S={load_s:.3f}")
          print(f"SYNTH_S={synth_s:.3f}")
          print(f"AUDIO_LEN_S={audio_s:.3f}")
          print(f"RTF={synth_s / audio_s:.4f}" if audio_s else "RTF=0")
          print(f"OUT_WAV_BYTES={os.path.getsize('out.wav')}")
          PY
          ls -lh out.wav
      - name: Upload out.wav artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-test-output
          path: out.wav
          if-no-files-found: warn
