# Dựng image worker LITE (GHCR) cho riêng job "assemble" của
# tutalab-tts — CHỈ chạy khi dispatch tay, tách hẳn khỏi
# build-worker-image.yml để không bao giờ đụng tag :latest của
# image đầy. Image lite: Python stdlib + ffmpeg + nhạc nền, không
# VieNeu/model/Rust dist (assemble không dùng — xem Dockerfile.lite).
name: build-worker-image-lite

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: <redacted>
      - name: Build + push image lite
        uses: docker/build-push-action@v6
        with:
          context: tutalab-worker
          file: tutalab-worker/Dockerfile.lite
          push: true
          tags: |
            ghcr.io/fruitcusp/tutalab-worker:lite
            ghcr.io/fruitcusp/tutalab-worker:sha-${{ github.sha }}-lite
          labels: |
            org.opencontainers.image.source=https://github.com/fruitcusp/test-actions-codespaces
          cache-from: type=gha,scope=lite
          cache-to: type=gha,mode=max,scope=lite
