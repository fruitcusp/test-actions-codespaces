# Đo đối đầu VieNeu trên Actions (lệnh Sếp 25/11/2026): pip vieneu 3.8.5
# vs vieneu-rs (dist Rust của nhà). Đặt tại .github/workflows/bench-engines.yml
# trong repo fruitcusp/test-actions-codespaces, kèm bench.py + thư mục bench/
# ở gốc repo. Nhánh Rust cần biến repo RUST_DIST_URL trỏ tới file
# vieneu-rust-dist.tar (432MB) đã tải lên Release của repo; thiếu biến này
# thì nhánh Rust tự ghi SKIPPED và verdict chốt Python.
name: bench-engines

on:
  workflow_dispatch:

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Chia truyện thành tối đa 20 đoạn
        id: mk
        run: |
          python3 bench.py split bench/story.txt bench-out/segments
          N=$(python3 -c "import json;print(json.load(open('bench-out/segments/manifest.json'))['parts'])")
          python3 -c "import json,sys; n=int('$N'); print('matrix='+json.dumps({'i':list(range(n))}))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: segments
          path: bench-out/segments

  short-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: vieneu-385-${{ runner.os }}-v1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q vieneu==3.8.5
          python3 bench.py inventory python
          python3 bench.py short python
      - uses: actions/upload-artifact@v4
        with:
          name: short-python
          path: bench-out

  short-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lấy dist Rust
        env:
          RUST_DIST_URL: ${{ vars.RUST_DIST_URL }}
        run: |
          mkdir -p bench-out
          if [ -z "$RUST_DIST_URL" ]; then echo "no RUST_DIST_URL" > bench-out/SKIPPED; exit 0; fi
          curl -sL "$RUST_DIST_URL" -o /tmp/dist.tar
          mkdir -p /tmp/rustdist && tar -xf /tmp/dist.tar -C /tmp/rustdist
          D=$(dirname "$(find /tmp/rustdist -name vieneu-rs -type f | head -1)")
          echo "RUST_DIST=$D" >> "$GITHUB_ENV"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if [ ! -f bench-out/SKIPPED ]; then
            python3 bench.py inventory rust
            python3 bench.py short rust
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: short-rust
          path: bench-out

  seg-python:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: vieneu-385-${{ runner.os }}-v1
      - uses: actions/download-artifact@v4
        with: { name: segments, path: bench-out/segments }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q vieneu==3.8.5
          printf -v SEG "bench-out/segments/seg_%02d.txt" ${{ matrix.i }}
          printf -v OUT "bench-out/segments/seg_%02d.wav" ${{ matrix.i }}
          python3 bench.py one python "$SEG" "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: seg-python-${{ matrix.i }}
          path: |
            bench-out/segments/*.wav
            bench-out/segments/*.json

  seg-rust:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: segments, path: bench-out/segments }
      - name: Lấy dist Rust + đọc 1 đoạn
        env:
          RUST_DIST_URL: ${{ vars.RUST_DIST_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if [ -z "$RUST_DIST_URL" ]; then echo "no RUST_DIST_URL" > bench-out/SKIPPED; exit 0; fi
          curl -sL "$RUST_DIST_URL" -o /tmp/dist.tar
          mkdir -p /tmp/rustdist && tar -xf /tmp/dist.tar -C /tmp/rustdist
          export RUST_DIST=$(dirname "$(find /tmp/rustdist -name vieneu-rs -type f | head -1)")
          printf -v SEG "bench-out/segments/seg_%02d.txt" ${{ matrix.i }}
          printf -v OUT "bench-out/segments/seg_%02d.wav" ${{ matrix.i }}
          python3 bench.py one rust "$SEG" "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: seg-rust-${{ matrix.i }}
          path: |
            bench-out/segments/*.wav
            bench-out/segments/*.json
            bench-out/SKIPPED

  compose-python:
    needs: seg-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: seg-python-*, path: bench-out/segments, merge-multiple: true }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 bench.py compose python
      - uses: actions/upload-artifact@v4
        with: { name: result-python, path: bench-out }

  compose-rust:
    needs: seg-rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: seg-rust-*, path: bench-out/segments, merge-multiple: true }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if [ -f bench-out/segments/SKIPPED ] || ! ls bench-out/segments/*.wav >/dev/null 2>&1; then
            mkdir -p bench-out
            echo '{"engine":"rust","skipped":true,"reason":"RUST_DIST_URL chua dat hoac dist loi"}' > bench-out/result-rust.json
          else
            python3 bench.py compose rust
          fi
      - uses: actions/upload-artifact@v4
        with: { name: result-rust, path: bench-out }

  verdict:
    needs: [compose-python, compose-rust, short-python, short-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: result-*, path: results, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: short-*, path: results, merge-multiple: true }
      - name: Bảng verdict
        run: |
          python3 - <<'EOF'
          import json, glob
          out = {}
          for eng in ("python", "rust"):
              p = f"results/result-{eng}.json"
              try: out[eng] = json.load(open(p))
              except Exception: out[eng] = {"skipped": True, "reason": "no result"}
              # wall uoc tinh kieu matrix: load + doan cham nhat
              segs = []
              for f in glob.glob("results/seg_*.wav.json"):
                  d = json.load(open(f))
                  if d.get("engine") == eng: segs.append(d)
              if segs:
                  out[eng]["wall_est_s"] = round(max(s["synth_s"] for s in segs) + max(s.get("load_s") or 0 for s in segs), 2)
                  out[eng]["max_seg_s"] = max(s["synth_s"] for s in segs)
          win = None
          py, rs = out.get("python", {}), out.get("rust", {})
          if not rs.get("skipped") and rs.get("wall_est_s") and py.get("wall_est_s"):
              win = "rust" if rs["wall_est_s"] < py["wall_est_s"] else "python"
          elif not py.get("skipped"):
              win = "python"
          out["winner"] = win
          print(json.dumps(out, ensure_ascii=False, indent=1))
          json.dump(out, open("results/verdict.json", "w"), ensure_ascii=False, indent=1)
          EOF
      - uses: actions/upload-artifact@v4
        with: { name: verdict, path: results }
