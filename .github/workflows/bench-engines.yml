# Đo VieNeu Rust trên Actions. BAN GOC (25/11/2026) do doi dau pip vieneu
# 3.8.5 vs vieneu-rs; toi 25/11/2026 Sep lenh 'chinh het sang ban rust'
# nen da BO HAN cac job python — workflow nay chi con do Rust, khong con
# doi chung Python nua. Can bien repo RUST_DIST_URL tro toi file
# vieneu-rust-dist.tar da tai len Release cua repo; thieu bien nay thi
# nhanh Rust tu ghi SKIPPED.
name: bench-engines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Chia truyện thành tối đa 20 đoạn
        id: mk
        run: |
          python3 bench.py split bench/story.txt bench-out/segments
          N=$(python3 -c "import json;print(json.load(open('bench-out/segments/manifest.json'))['parts'])")
          python3 -c "import json,sys; n=int('$N'); print('matrix='+json.dumps({'i':list(range(n))}))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: segments
          path: bench-out/segments

  short-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lấy dist Rust
        env:
          RUST_DIST_URL: ${{ vars.RUST_DIST_URL }}
        run: |
          mkdir -p bench-out
          if [ -z "$RUST_DIST_URL" ]; then echo "no RUST_DIST_URL" > bench-out/SKIPPED; exit 0; fi
          curl -sL "$RUST_DIST_URL" -o /tmp/dist.tar
          mkdir -p /tmp/rustdist && tar -xf /tmp/dist.tar -C /tmp/rustdist
          D=$(dirname "$(find /tmp/rustdist -name vieneu-rs -type f | head -1)")
          echo "RUST_DIST=$D" >> "$GITHUB_ENV"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if [ ! -f bench-out/SKIPPED ]; then
            python3 bench.py inventory rust
            python3 bench.py short rust
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: short-rust
          path: bench-out

  seg-rust:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: segments, path: bench-out/segments }
      - name: Lấy dist Rust + đọc 1 đoạn
        env:
          RUST_DIST_URL: ${{ vars.RUST_DIST_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          # SKIPPED ghi TRONG segments/: để ở bench-out/ làm artifact lệch
          # gốc -> file bị lồng segments/segments khi tải xuống, compose-rust
          # tưởng thiếu wav nên tự ghi skipped (bắt tại run 45462790733).
          if [ -z "$RUST_DIST_URL" ]; then echo "no RUST_DIST_URL" > bench-out/segments/SKIPPED; exit 0; fi
          curl -sL "$RUST_DIST_URL" -o /tmp/dist.tar
          mkdir -p /tmp/rustdist && tar -xf /tmp/dist.tar -C /tmp/rustdist
          export RUST_DIST=$(dirname "$(find /tmp/rustdist -name vieneu-rs -type f | head -1)")
          printf -v SEG "bench-out/segments/seg_%02d.txt" ${{ matrix.i }}
          printf -v OUT "bench-out/segments/seg_%02d.wav" ${{ matrix.i }}
          python3 bench.py one rust "$SEG" "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seg-rust-${{ matrix.i }}
          path: |
            bench-out/segments/*.wav
            bench-out/segments/*.json
            bench-out/segments/SKIPPED

  compose-rust:
    needs: seg-rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: seg-rust-*, path: bench-out/segments, merge-multiple: true }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if [ -f bench-out/segments/SKIPPED ] || ! ls bench-out/segments/*.wav >/dev/null 2>&1; then
            mkdir -p bench-out
            echo '{"engine":"rust","skipped":true,"reason":"RUST_DIST_URL chua dat hoac dist loi"}' > bench-out/result-rust.json
          else
            python3 bench.py compose rust
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: result-rust, path: bench-out }

  verdict:
    needs: [compose-rust, short-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: result-rust, path: results-rs }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: short-*, path: results, merge-multiple: true }
      - name: Bang verdict (Rust only tu 25/11/2026)
        run: |
          python3 - <<'EOF'
          import json, glob
          out = {}
          try: out["rust"] = json.load(open("results-rs/result-rust.json"))
          except Exception: out["rust"] = {"skipped": True, "reason": "no result"}
          segs = []
          for f in glob.glob("results-rs/**/seg_*.wav.json", recursive=True):
              d = json.load(open(f))
              if d.get("engine") == "rust": segs.append(d)
          if segs:
              out["rust"]["wall_est_s"] = round(max(s["synth_s"] for s in segs) + max(s.get("load_s") or 0 for s in segs), 2)
              out["rust"]["max_seg_s"] = max(s["synth_s"] for s in segs)
          out["winner"] = "rust"
          out["note"] = "25/11/2026: da bo han engine python theo lenh Sep — workflow chi con do Rust, khong con doi chung Python."
          print(json.dumps(out, ensure_ascii=False, indent=1))
          json.dump(out, open("results/verdict.json", "w"), ensure_ascii=False, indent=1)
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: verdict, path: results }
